name: Deploy to EC2 (Ubuntu)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy repo to EC2 (only needed files)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          port: 22
          debug: true
          # Use comma-separated list so drone-scp expands correctly
          source: ./client/**,./server/**,./.dockerignore,./Dockerfile
          target: "~/mern-app"
          rm: true
          strip_components: 0

      - name: SSH into EC2 & deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd ~/mern-app

            # Stop and remove old container if exists
            if [ "$(sudo docker ps -aq -f name=mern-app)" ]; then
              sudo docker rm -f mern-app || true
            fi

            # Build image using provided Dockerfile (builds client and bundles into server/public)
            sudo docker build -t mern-app:latest .

            # Run container
            sudo docker run -d \
              --name mern-app \
              --restart unless-stopped \
              -e NODE_ENV=production \
              -e PORT=${{ secrets.PORT }} \
              -e MONGOURI='${{ secrets.MONGOURI }}' \
              -p 8000:8000 \
              mern-app:latest
